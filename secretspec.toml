[project]
name = "tether"
revision = "1.0"

# Provider: keyring (KeePassXC via Secret Service). Each name below is a
# KeePassXC entry with the secret in the "Password" field; grant Secret Service
# access per entry. Populate with `secretspec check`, then:
#
#   secretspec run -- ./provision.sh      render /var/lib/tether.env on atlas
#   secretspec run -- ./tether sync       local dev against a scratch state dir
#
# LLAMA_API_KEY is intentionally absent: provision.sh reads it from
# /var/lib/llama-server.env on atlas, the single source of truth for that key.

[profiles.default]
TETHER_IMAP_USER = { description = "Gmail address", required = false, default = "ethanthoma@gmail.com" }
TETHER_IMAP_PASSWORD = { description = "Gmail app password (myaccount.google.com/apppasswords, needs 2FA; enter without spaces)", required = true }
TETHER_ICS_URL = { description = "Google Calendar settings -> your calendar -> Secret address in iCal format", required = true }
TETHER_DISCORD_TOKEN = { description = "Discord bot token (discord.com/developers -> your app -> Bot -> Reset Token)", required = true }
TETHER_DISCORD_CHANNEL = { description = "Discord channel id (enable Developer Mode, right-click the channel -> Copy Channel ID)", required = true }
TETHER_DISCORD_PUBLIC_KEY = { description = "Discord app public key (developer portal -> General Information -> Public Key); verifies slash-command signatures", required = true }

# Calendar writes (/event). Optional: everything else works without them.
# Order: store the id + secret, run `secretspec run -- ./tether auth`, store the token.
TETHER_GOOGLE_CLIENT_ID = { description = "GCP OAuth client id, type Desktop app", required = false }
TETHER_GOOGLE_CLIENT_SECRET = { description = "GCP OAuth client secret for that client", required = false }
TETHER_GOOGLE_REFRESH_TOKEN = { description = "printed by `tether auth`; needs the app in Production status or it expires in 7 days", required = false }
